; ============================================================================
; Overrides do appserver.ini
; ============================================================================
;
; O appserver.ini NÃO existe em disco: ele é gerado do zero pelo entrypoint.sh
; a cada boot, a partir do .env. Editá-lo dentro do container não adianta — a
; alteração some no próximo restart (e um `./run.sh compile` reinicia o core).
;
; Este arquivo é o ponto de extensão. Ele é mesclado no .ini gerado, no boot:
;
;   - chave que já existe    -> substituída, na seção certa;
;   - chave nova numa seção  -> acrescentada àquela seção;
;   - seção nova             -> acrescentada ao fim.
;
; Vale para o core e para os jobs (worker, upddistr, compile). A mesclagem é a
; última etapa antes de subir o binário, então o que estiver aqui vence.
;
; Depois de editar, basta reiniciar — não precisa rebuildar a imagem:
;
;   ./run.sh
;
; Para conferir o resultado:
;
;   docker exec protheus_core cat /totvs/protheus/bin/appserver/appserver.ini
;
; ----------------------------------------------------------------------------
; Cuidado: chaves como DBServer, DBPort, DBAlias, RootPath e as portas vêm do
; .env por um motivo. Sobrescrevê-las aqui faz o .env passar a mentir sobre o
; ambiente — foi exatamente esse tipo de divergência que já nos custou horas.
; Prefira o .env para o que ele já parametriza.
; ----------------------------------------------------------------------------
;
; ----------------------------------------------------------------------------
; TDS / VSCode — ambiente de DESENVOLVIMENTO
; ----------------------------------------------------------------------------
; A seção [TDS] é o sistema de privilégios do AppServer para clientes TDS. Cada
; chave recebe uma LISTA DE IPs: `*` libera geral, `0` bloqueia todo mundo.
;
; Chave AUSENTE = operação LIBERADA (é o default, para compatibilizar com .ini
; antigos). Ou seja, AllowCompile abaixo é redundante hoje — está explícito de
; propósito: um dia alguém endurece o heredoc e a compilação para de funcionar
; sem que nada no repositório diga por quê.
;
; O heredoc gera, no papel `core`, um bloco de governança com AllowApplyPatch=0.
; Faz sentido em runtime; num ambiente de dev, trabalha contra você. Aqui ele é
; sobrescrito.
;
; A isenção "conexão local ignora o [TDS]" NÃO vale aqui: o AppServer enxerga o
; VSCode como o IP do gateway da bridge do Docker, nunca como 127.0.0.1. Por
; isso `*`, e não confiar no localhost.
;
; Alterar esta seção exige RECONECTAR o VSCode — o privilégio é lido na conexão.
[TDS]
AllowCompile=*
AllowBuildPatch=*
AllowApplyPatch=*
AllowApplyTemplate=*

[ONSTART]
Jobs=HTTPJOB

; ATENCAO (upddistr): este [ONSTART] e mesclado em TODOS os papeis e sobrescreve
; o "Jobs=UPDJOB" que o entrypoint define no papel upddistr -> o migrador nunca
; roda (fica ocioso no HTTPJOB, sem gerar Result.json). Para rodar
; "./run.sh <sgbd> upddistr", COMENTAR este bloco antes (o core recebe HTTPJOB
; do proprio entrypoint, entao o REST nao quebra) e restaurar depois.

; ----------------------------------------------------------------------------
; Exemplos (descomente e ajuste):
;
; [General]
; ConsoleLog=1
; MaxStringSize=1000
;
; [protheus_dev]              ; a seção do ambiente tem o nome de ENV_NAME
; TopMemoMega=100
;
; NOTA (REST na porta multiprotocolo): NAO tentar servir /rest via socket HTTP na
; porta multiprotocolo (1234). O dispatcher MULTIPORT so reconhece SmartClient
; binario + WebSocket (o WebApp usa WebSocket); um "GET /rest HTTP/1.1" cru cai em
; "MULTIPORT - error 5 unrecognized client" e um 2o socket HTTP na 1234 falha com
; EADDRINUSE (98). O modo embarcado com "/rest" na MESMA origem (TCloud) e servido
; por um GATEWAY/PROXY REVERSO na frente, nao pelo appserver. Para reproduzir isso
; localmente use um proxy reverso (ex.: nginx) roteando /webapp->1234 e /rest->8400
; numa unica origem. O REST dedicado na 8400 (fluxo dev/browser) e o correto local.




[HTTPREST]
Instances=2,4

; Health check do Monitor de Integracao chama rotas do proprio AppServer (ex.: /rest/porto/health)
; de dentro de uma requisicao REST: com 1 instancia na URI a chamada espera a si mesma e estoura
; o timeout. Duas instancias minimas resolvem (02/10/2026).
[HTTPURI]
Instances=2,4
